[package]
name = "mft"
version = "0.8.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2024"
rust-version = "1.90"

[lib]
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
mft_rs = { version = "0.8.0", default-features = false, package = "mft", git = "https://github.com/omerbenamram/mft", rev = "6305ba1c5102e24943928dabc7ec2b8d5ce58de4" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
num-traits = "0.2"
bitflags = "2"
log = { version = "0.4", features = ["std"] }
pyo3-file = "0.18.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }
sonic-rs = "0.5"
csv = "1"

[build-dependencies]
pyo3-build-config = "0.30.1"
